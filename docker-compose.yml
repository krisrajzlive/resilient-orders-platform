services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: orders-postgres
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-orders-local-dev}
      POSTGRES_DB: orders
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - orders-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orders-pgdata:
